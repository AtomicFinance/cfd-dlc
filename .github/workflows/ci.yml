name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CMAKE_VERSION: 3.17.2

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run lint
        run: ./scripts/lint_quiet.sh

  cmake-win-test:
    name: cmake build-win
    runs-on: windows-latest
    strategy:
      matrix:
        generator: ['Visual Studio 17 2022', 'MSYS Makefiles']
        shared: [on, off]

    steps:
    - uses: actions/checkout@v4
    - name: cmake_version
      run: cmake --version
    - name: cmake_configure
      run: cmake -S . -B build -G "${{ matrix.generator }}" -DENABLE_SHARED=${{ matrix.shared }} -DENABLE_TESTS=on -DCMAKE_BUILD_TYPE=Release
    - name: cmake_build
      run: cmake --build build --config Release --parallel 4
    - name: test
      run: |
        cd build
        ctest -C Release --output-on-failure --exclude-regex "cfddlc_test"

  cmake-mac-test:
    name: cmake build-mac
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: cmake_version
      run: cmake --version
    - name: cmake_configure
      run: cmake -S . -B build -G "Unix Makefiles" -DENABLE_SHARED=on -DCMAKE_BUILD_TYPE=Release
    - name: cmake_build
      run: cmake --build build --config Release --parallel 4
    - name: test
      run: ./scripts/run_cfddlc_tests.sh
    - name: lint_check
      run: ./scripts/lint_quiet.sh

  cmake-ubuntu-test:
    name: cmake build-ubuntu
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        shared: [on, off]

    steps:
    - uses: actions/checkout@v4
    - name: dump version
      run: |
        cmake --version
        gcc --version
    - name: cmake_configure
      run: |
        cmake -S . -B build -G "Unix Makefiles" -DENABLE_SHARED=${{ matrix.shared }} -DCMAKE_BUILD_TYPE=Release
    - name: cmake_build
      run: cmake --build build --config Release --parallel 4
    - name: lint_check
      run: ./scripts/lint_quiet.sh
    - name: test
      run: |
        if [ "${{ matrix.shared }}" = "on" ]; then
          ./scripts/run_cfddlc_tests.sh
        fi
